services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a09_jenkins_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-a09_jenkins}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-appsecret}
      DB_PORT: 3306
      WEBSITE_URL: http://localhost:${WEB_PORT:-8080}
      LIVE_RELOAD_URL: http://localhost:${DEV_PORT:-3000}/browser-sync/browser-sync-client.js
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html

  dev:
    image: node:20-alpine
    container_name: a09_jenkins_dev
    depends_on:
      - web
    working_dir: /workspace
    command: sh -c "npm install; npm run dev"
    ports:
      - "${DEV_PORT:-3000}:3000"
      - "${DEV_UI_PORT:-3001}:3001"
    volumes:
      - ./:/workspace
      - dev_node_modules:/workspace/node_modules

  db:
    image: mariadb:11.4
    container_name: a09_jenkins_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-a09_jenkins}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-appsecret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/a09_jenkins.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:
  dev_node_modules: